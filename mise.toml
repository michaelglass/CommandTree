[tools]
dotnet = "10.0"

[tasks.restore]
description = "Restore dependencies"
run = "dotnet restore"

[tasks.tool-restore]
description = "Restore local dotnet tools"
run = "dotnet tool restore"

[tasks.build]
description = "Build the solution"
run = "dotnet build"
depends = ["restore"]

[tasks.test]
description = "Run tests with coverage"
run = """
dotnet test \
  --coverage \
  --coverage-output-format cobertura \
  --coverage-output "$PWD/coverage/coverage.cobertura.xml"
"""
depends = ["build"]

[tasks.example]
description = "Run the example app"
run = "dotnet run --project examples/ExampleCli"
depends = ["build"]

[tasks.example-build]
description = "Build the example app (for CI)"
run = "dotnet build examples/ExampleCli --warnaserror"
depends = ["build"]

[tasks.format]
description = "Format code with Fantomas"
run = "dotnet fantomas src/ tests/ examples/"
depends = ["tool-restore"]

[tasks.format-check]
description = "Check formatting without making changes"
run = "dotnet fantomas src/ tests/ examples/ --check"
depends = ["tool-restore"]

[tasks.lint]
description = "Run FSharpLint"
run = "dotnet fsharplint lint CommandTree.slnx"
depends = ["build", "tool-restore"]

[tasks.coverage-check]
description = "Check per-file coverage meets minimum threshold"
run = "(cd coverage && dotnet tool run coverageratchet check ../coverage-ratchet-CommandTree.json)"
depends = ["test"]

[tasks.coverage-ratchet]
description = "Tighten coverage thresholds to current values"
run = "(cd coverage && dotnet tool run coverageratchet ratchet ../coverage-ratchet-CommandTree.json)"
depends = ["test"]

[tasks.coverage-loosen]
description = "Loosen coverage thresholds to current values"
run = "(cd coverage && dotnet tool run coverageratchet loosen ../coverage-ratchet-CommandTree.json)"
depends = ["test"]

[tasks.loosen-from-ci]
description = "Merge coverage thresholds from CI artifacts"
run = "(cd coverage && dotnet tool run coverageratchet loosen-from-ci ../coverage-ratchet-CommandTree.json)"
depends = ["test"]

[tasks.sync-docs]
description = "Sync README.md content to docs/index.md"
run = "dotnet tool run syncdocs sync"
depends = ["tool-restore"]

[tasks.sync-docs-check]
description = "Check if docs/index.md is in sync with README.md"
run = "dotnet tool run syncdocs check"
depends = ["tool-restore"]

[tasks.lint-project]
description = "Lint F# project files"
run = "dotnet tool run fsprojlint"
depends = ["tool-restore"]

[tasks.check]
description = "Run all checks with auto-fix (format, sync-docs, then verify)"
depends = ["format", "sync-docs", "lint", "lint-project", "coverage-ratchet", "docs", "example-build"]

[tasks.ci]
description = "Run all CI checks (no auto-fix)"
depends = ["format-check", "lint", "lint-project", "coverage-check", "sync-docs-check", "docs", "example-build"]

[tasks.pack]
description = "Create NuGet package"
run = "dotnet pack src/CommandTree/CommandTree.fsproj -c Release"
depends = ["build"]

[tasks.release]
description = "Release a new version"
run = "dotnet tool run fssemantictagger release"
depends = ["ci"]

[tasks.release-dry-run]
description = "Preview a release without mutating (no tag, no publish)"
run = "dotnet tool run fssemantictagger release --dry-run"
depends = ["build"]

[tasks.release-alpha]
description = "Start alpha pre-release"
run = "dotnet tool run fssemantictagger alpha"
depends = ["build"]

[tasks.docs]
description = "Generate API documentation"
run = "dotnet fsdocs build --output output/docs --clean --parameters root /CommandTree/"
depends = ["build", "tool-restore"]

[tasks.docs-watch]
description = "Watch and serve documentation locally"
run = "dotnet fsdocs watch"
depends = ["build", "tool-restore"]
